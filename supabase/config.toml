# Supabase CLI configuration for the LOCAL development stack and CI.
# Reference: https://supabase.com/docs/guides/local-development/cli/config
#
# This file configures the stack started by `supabase start`. It does NOT push
# settings to the hosted project; hosted Auth settings are managed in the dashboard.
# Never put real secrets in this file. Use env(NAME) substitution if a secret is ever needed.

project_id = "ombre"

[api]
enabled = true
# Mirrors the hosted project's Data API exposure: `public` and `graphql_public`.
# The `private` schema is not exposed and must never be added here.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
# Must match the hosted project's Postgres major version.
major_version = 17

[auth]
enabled = true
# Local origin served by `vercel dev` (port 3000): the SPA and the same-origin /api BFF.
# Email links (PKCE) land on /auth/callback and /auth/callback/recovery.
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://localhost:3000/auth/callback/recovery", "http://127.0.0.1:3000/auth/callback", "http://127.0.0.1:3000/auth/callback/recovery"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
# A2 password policy: 12 characters minimum (also enforced by the /api layer).
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
# Changing a password requires a recent sign-in (recovery sessions count).
secure_password_change = true

# Captured from the deployed function. Requests without a valid JWT are rejected.
[functions.user-context]
verify_jwt = true
