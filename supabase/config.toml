# Supabase CLI configuration for the LOCAL development stack and CI.
# Reference: https://supabase.com/docs/guides/local-development/cli/config
#
# This file configures the stack started by `supabase start`. It does NOT push
# settings to the hosted project; hosted Auth settings are managed in the dashboard.
# Never put real secrets in this file. Use env(NAME) substitution if a secret is ever needed.

project_id = "ombre"

[api]
enabled = true
# Only `public` is exposed through the Data API. The `private` schema must never be added here.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
# Must match the hosted project's Postgres major version.
major_version = 17

[auth]
enabled = true
# Local origin of the Vite dev server. Revisit when the same-origin /api BFF is wired up (A2/A3).
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

# Captured from the deployed function. Requests without a valid JWT are rejected.
[functions.user-context]
verify_jwt = true
